name: "Live GitHub-to-Gemini Notebook Sync"
description: "Zero-dependency Git repository sharder and native Google Doc sync engine for Gemini Notebooks (NotebookLM)."
branding:
  icon: "book-open"
  color: "blue"

inputs:
  gas-webhook-url:
    description: "Deployed Google Apps Script Web App /exec URL"
    required: true
  gas-webhook-secret:
    description: "Shared secret token matching SECRET_TOKEN in Code.gs"
    required: true
  repo-name:
    description: "Optional override for the subfolder and doc prefix in Google Drive (defaults to repository name)"
    required: false
    default: ""
  max-shard-chars:
    description: "Maximum character ceiling per Google Doc shard"
    required: false
    default: "450000"
  max-single-file-bytes:
    description: "Maximum byte threshold for a single tracked text file"
    required: false
    default: "350000"
  dry-run:
    description: "Set to true to compute shards and hashes without calling the GAS webhook"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Run Bottom-Up Shard Bundler & Push to GAS Webhook
      shell: bash
      env:
        GAS_WEBHOOK_URL: ${{ inputs.gas-webhook-url }}
        GAS_WEBHOOK_SECRET: ${{ inputs.gas-webhook-secret }}
        REPO_NAME: ${{ inputs.repo-name }}
        MAX_SHARD_CHARS: ${{ inputs.max-shard-chars }}
        MAX_SINGLE_FILE_BYTES: ${{ inputs.max-single-file-bytes }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        if ! command -v python3 >/dev/null 2>&1; then
          echo "ERROR: python3 is required on the runner PATH." >&2
          exit 1
        fi
        if [ -f "${{ github.action_path }}/notebook-sync.py" ]; then
          SCRIPT_PATH="${{ github.action_path }}/notebook-sync.py"
        else
          SCRIPT_PATH="${{ github.action_path }}/.github/scripts/notebook-sync.py"
        fi
        python3 "$SCRIPT_PATH"